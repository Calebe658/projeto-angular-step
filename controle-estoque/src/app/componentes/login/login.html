<div class="main-container">

    <form [formGroup]="loginForm" (ngSubmit)="login()">

        <h1>Login</h1>

        <mat-form-field appearance="outline">
            <mat-label>E-mail</mat-label>

            <input matInput type="email" formControlName="email" (blur)="updateErrorMessage()"
                placeholder="Digite seu e-mail" required />

            @if (loginForm.get('email')?.invalid) {
            <mat-error>{{errorMessageInput()}}</mat-error>

            }
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Senha</mat-label>

            <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password"
                placeholder="Digite sua senha" (blur)="updateErrorMessagePassword()" required />

            <button matIconButton matSuffix (click)="clickEvent($event)" [attr.aria-label]="'Hide password'"
                [attr.aria-pressed]="hide()" type="button">
                <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>

            @if (loginForm.get('password')?.invalid) {
            <mat-error>{{errorMessageInputPassword()}}</mat-error>

            }
        </mat-form-field>

        <button matButton="tonal" type="submit" id="login-button">Entrar</button>
    </form>
</div>
